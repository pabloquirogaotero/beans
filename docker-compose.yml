# The whole system: `docker compose up --build`, then open http://localhost:8080/swagger-ui.html
# For development from the IDE, start only the infrastructure: `docker compose up -d db kafka`
# Host ports can be changed if they are taken, e.g. `DB_PORT=55432 docker compose up --build`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: beans
      POSTGRES_USER: beans
      POSTGRES_PASSWORD: beans
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - beans-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beans -d beans"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      # Two listeners: containers reach the broker as kafka:29092, the host as localhost:9092.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 3s
      retries: 30

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/beans
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  beans-data:
