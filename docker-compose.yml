services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: beans
      POSTGRES_USER: beans
      POSTGRES_PASSWORD: beans
    ports:
      - "5432:5432"
    volumes:
      - beans-data:/var/lib/postgresql/data
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
volumes:
  beans-data:
